name: Render video
on:
  push:
    paths: ["episodes/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0
          pip install -q kokoro-onnx soundfile pillow numpy
      - name: Cache assets
        id: cache
        uses: actions/cache@v4
        with:
          path: assets
          key: assets-v1
      - name: Download assets
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets/fonts tmp && cd tmp
          curl -sL -o ../assets/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sL -o ../assets/voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          for p in @expo-google-fonts/hind @expo-google-fonts/oswald world-atlas; do npm pack -q $p; done
          for f in *.tgz; do mkdir -p "x_$f" && tar xzf "$f" -C "x_$f"; done
          find . -name 'Hind_*.ttf' -exec cp {} ../assets/fonts/ \;
          find . -name 'Oswald_*.ttf' -exec cp {} ../assets/fonts/ \;
          cp x_world-atlas*/package/land-50m.json ../assets/
          cd .. && python3 tools/extract_land.py
      - name: Render episodes that have no video yet
        run: |
          python3 -c "from PIL import features; print('raqm', features.check('raqm'))"
          mkdir -p videos
          for ep in episodes/*.json; do
            name=$(basename "$ep" .json)
            [ -f "videos/$name.mp4" ] && continue
            python3 news_video2.py "$ep" "out/$name"
            cp "out/$name/video2.mp4" "videos/$name.mp4"
            cp "out/$name/thumb2.jpg" "videos/$name.jpg"
            cp "out/$name/meta2.json" "videos/$name.meta.json"
          done
      - name: Commit videos
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add videos
          git commit -m "Rendered videos" || exit 0
          git pull --rebase
          git push
